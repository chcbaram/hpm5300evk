<text xml:space="preserve" x="433" y="239" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#1f2328" text-anchor="end" font-weight="700">600 MHz</text>
<text xml:space="preserve" x="292" y="254" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="10" fill="#6a737d" text-anchor="start" font-weight="400">PLL0 포스트 분주</text>
<path d="M 190,172 L 235,172 L 235,242 L 276,242" fill="none" stroke="#8c959f" stroke-width="1.3" marker-end="url(#a)"/>
