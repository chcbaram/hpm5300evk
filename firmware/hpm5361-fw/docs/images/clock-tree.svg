<text xml:space="preserve" x="115" y="104" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#6a737d" text-anchor="middle" font-weight="400">24 MHz</text>
