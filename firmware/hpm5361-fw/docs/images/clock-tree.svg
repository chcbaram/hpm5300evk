<text xml:space="preserve" x="292" y="299" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#1f2328" text-anchor="start" font-weight="400">CLK2  (÷2.4)</text>
<text xml:space="preserve" x="433" y="299" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#1f2328" text-anchor="end" font-weight="700">400 MHz</text>
<text xml:space="preserve" x="292" y="314" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="10" fill="#6a737d" text-anchor="start" font-weight="400">PLL0 포스트 분주</text>
<path d="M 190,172 L 235,172 L 235,302 L 276,302" fill="none" stroke="#8c959f" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="560" y="128" width="280" height="44" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
<text xml:space="preserve" x="575" y="146" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" fill="#1f2328" text-anchor="start" font-weight="400">CPU0 / ILM / DLM / FGPIO</text>
<text xml:space="preserve" x="825" y="146" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#16a34a" text-anchor="end" font-weight="700">480 MHz</text>
<text xml:space="preserve" x="575" y="163" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#6a737d" text-anchor="start" font-weight="400">PLL0CLK0 ÷ 2</text>
<path d="M 445,170 L 510,170 L 510,150 L 556,150" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="560" y="190" width="280" height="44" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
<text xml:space="preserve" x="575" y="208" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" fill="#1f2328" text-anchor="start" font-weight="400">AXI / AHB   주변장치 버스</text>
<text xml:space="preserve" x="825" y="208" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#16a34a" text-anchor="end" font-weight="700">160 MHz</text>
<text xml:space="preserve" x="575" y="225" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#6a737d" text-anchor="start" font-weight="400">PLL0CLK0 ÷ 3   HDMA / GPIO / ADC</text>
<path d="M 445,170 L 510,170 L 510,212 L 556,212" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="560" y="252" width="280" height="40" rx="5" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/>
<text xml:space="preserve" x="575" y="270" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" fill="#1f2328" text-anchor="start" font-weight="400">mchtmr0   1 ms 틱</text>
<text xml:space="preserve" x="825" y="270" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#1f2328" text-anchor="end" font-weight="700">24 MHz</text>
<text xml:space="preserve" x="575" y="286" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#6a737d" text-anchor="start" font-weight="400">osc24m 직결 (itInit)</text>
<path d="M 190,92 L 520,92 L 520,272 L 556,272" fill="none" stroke="#8c959f" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#a)"/>
<rect x="40" y="330" width="800" height="46" rx="4" fill="#fff7ed" stroke="#ea580c" stroke-width="1.2"/>
<text xml:space="preserve" x="56" y="350" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="12" fill="#1f2328" text-anchor="start" font-weight="600">리셋 직후 ~ main() 진입까지는 24MHz 다. 480MHz 는 board_init_clock() 이 만든다.</text>
<text xml:space="preserve" x="56" y="368" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" fill="#6a737d" text-anchor="start" font-weight="400">DCDC 를 1.275V 로 올린 뒤 주파수를 올린다 — 순서를 뒤집으면 저전압 고주파 구간이 생긴다.</text>
